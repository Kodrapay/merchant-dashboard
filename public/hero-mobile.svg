<svg width="400" height="800" viewBox="0 0 400 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="800" fill="#F8FAFC" rx="40" />
  
  <!-- Status Bar -->
  <rect x="0" y="0" width="400" height="44" fill="#FFFFFF" />
  <text x="32" y="30" font-family="sans-serif" font-size="14" font-weight="600" fill="#0F172A">9:41</text>
  
  <!-- Header -->
  <rect x="0" y="44" width="400" height="60" fill="#FFFFFF" />
  <text x="32" y="80" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0F172A">Home</text>
  <circle cx="360" cy="74" r="16" fill="#E2E8F0" />
  
  <!-- Balance Card -->
  <rect x="24" y="120" width="352" height="180" rx="16" fill="#0F172A" />
  <text x="48" y="160" font-family="sans-serif" font-size="14" fill="#94A3B8">Total Balance</text>
  <text x="48" y="200" font-family="sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF">₦2,450,300</text>
  
  <rect x="48" y="240" width="100" height="36" rx="8" fill="#334155" />
  <text x="70" y="263" font-family="sans-serif" font-size="14" fill="#FFFFFF">Withdraw</text>
  
  <rect x="160" y="240" width="100" height="36" rx="8" fill="#334155" />
  <text x="188" y="263" font-family="sans-serif" font-size="14" fill="#FFFFFF">Add Money</text>
  
  <!-- Recent Activity -->
  <text x="24" y="340" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0F172A">Recent Activity</text>
  
  <!-- Transaction 1 -->
  <rect x="24" y="360" width="352" height="72" rx="12" fill="#FFFFFF" />
  <circle cx="60" cy="396" r="20" fill="#E0F2FE" />
  <text x="96" y="390" font-family="sans-serif" font-size="16" font-weight="600" fill="#0F172A">Payment from John Doe</text>
  <text x="96" y="410" font-family="sans-serif" font-size="12" fill="#64748B">Today, 10:23 AM</text>
  <text x="290" y="400" font-family="sans-serif" font-size="16" font-weight="600" fill="#10B981">+ ₦5,000</text>
  
  <!-- Transaction 2 -->
  <rect x="24" y="444" width="352" height="72" rx="12" fill="#FFFFFF" />
  <circle cx="60" cy="480" r="20" fill="#FEE2E2" />
  <text x="96" y="474" font-family="sans-serif" font-size="16" font-weight="600" fill="#0F172A">Server Costs</text>
  <text x="96" y="494" font-family="sans-serif" font-size="12" fill="#64748B">Yesterday, 4:00 PM</text>
  <text x="290" y="484" font-family="sans-serif" font-size="16" font-weight="600" fill="#EF4444">- ₦12,000</text>
  
    <!-- Transaction 3 -->
  <rect x="24" y="528" width="352" height="72" rx="12" fill="#FFFFFF" />
  <circle cx="60" cy="564" r="20" fill="#E0F2FE" />
  <text x="96" y="558" font-family="sans-serif" font-size="16" font-weight="600" fill="#0F172A">Payment from Alice</text>
  <text x="96" y="578" font-family="sans-serif" font-size="12" fill="#64748B">Yesterday, 2:15 PM</text>
  <text x="290" y="568" font-family="sans-serif" font-size="16" font-weight="600" fill="#10B981">+ ₦3,500</text>

  <!-- Bottom Nav -->
  <rect x="0" y="720" width="400" height="80" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
  <rect x="40" y="736" width="48" height="48" rx="8" fill="#E0F2FE" />
  <circle cx="64" cy="760" r="4" fill="#0284C7" />
  
</svg>
